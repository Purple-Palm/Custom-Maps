[versions]
agp = "9.4.1"
kotlin = "2.4.21"

android-compileSdk = "37"
android-targetSdk = "36"
android-minSdk = "26"

androidx-activity = "1.13.0"
androidx-core = "1.19.1"
androidx-datastore = "1.3.0"
androidx-lifecycle = "2.11.0"
compose-bom = "2026.09.00"
coroutines = "1.11.0"
junit = "6.1.3"
# Navigation, Maps and Search must share the same minor version (3.34 / 11.34 / 2.34).
mapbox-navigation = "3.34.1"
mapbox-search = "2.34.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
mapbox-navigation = { module = "com.mapbox.navigationcore:navigation-ndk27", version.ref = "mapbox-navigation" }
mapbox-navigation-tripdata = { module = "com.mapbox.navigationcore:tripdata-ndk27", version.ref = "mapbox-navigation" }
mapbox-navigation-ui-maps = { module = "com.mapbox.navigationcore:ui-maps-ndk27", version.ref = "mapbox-navigation" }
mapbox-search = { module = "com.mapbox.search:mapbox-search-android-ndk27", version.ref = "mapbox-search" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
