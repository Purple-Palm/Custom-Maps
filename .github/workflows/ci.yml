name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and publish the debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      bundle: ${{ steps.build.outputs.bundle }}
      version-code: ${{ steps.build.outputs.version-code }}
      play-key: ${{ steps.play-key.outputs.set }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # All build steps live in scripts/ci.sh. The signing secrets are optional: without the four
      # release secrets no app bundle is built.
      - name: Build, test, lint and check 16 KB alignment
        id: build
        run: scripts/ci.sh
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Publish the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/ci/*.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      # The bundle holds no secret; like the APK, anyone signed in to GitHub can download it.
      - name: Publish the app bundle for Google Play
        if: steps.build.outputs.bundle != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/ci/${{ steps.build.outputs.bundle }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      # Only whether the Google Play key is set (true or false) leaves this step; the key itself never
      # reaches this job.
      - name: Check for the Google Play key
        id: play-key
        env:
          KEY_SET: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        run: echo "set=$KEY_SET" >> "$GITHUB_OUTPUT"

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.run_number }}
          path: |
            */build/reports/
            */build/test-results/
          retention-days: 7

  # Publishes the app bundle of a green build of main on Google Play internal testing, and nowhere
  # else. It runs only once the Google Play key is set, which comes after the app's first release was
  # rolled out by hand (README, "Release through Google Play").
  publish:
    name: Publish the app bundle on Google Play internal testing
    needs: build
    if: >-
      needs.build.outputs.bundle != '' && needs.build.outputs.play-key == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One upload at a time: a new edit invalidates one that is still open. A running upload is never
    # cancelled; one that waits gives way to a newer one.
    concurrency:
      group: google-play-internal-testing
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The bundle the build job checked, as it is: never unzipped.
      - name: Download the app bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.bundle }}
          path: ${{ runner.temp }}/bundle
          skip-decompress: true

      # The Google Play key reaches only this step.
      - name: Upload to internal testing
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
        run: |
          shopt -s nullglob
          bundles=("$RUNNER_TEMP"/bundle/*)
          [[ ${#bundles[@]} -eq 1 ]] || { echo "Expected one downloaded bundle, found ${#bundles[@]}." >&2; exit 1; }
          scripts/play-upload.sh --package io.github.purplepalm.custommaps --track internal \
            --version-code "$VERSION_CODE" "${bundles[0]}"
