name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and publish the debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      bundle: ${{ steps.build.outputs.bundle }}
      version-code: ${{ steps.build.outputs.version-code }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # All build steps live in scripts/ci.sh. The signing secrets are optional: without the four
      # release secrets no app bundle is built. GitHub hands a job only the secrets it names, and this
      # job never names the Google Play key, so its runner, which runs Gradle, never holds that key.
      - name: Build, test, lint and check 16 KB alignment
        id: build
        run: scripts/ci.sh
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # scripts/ci.sh writes the APK to build/ci only after its tests, lint and 16 KB check passed, so it
      # is published even when the app bundle part after it fails, for example with a wrong release
      # secret. The run stays red, and the bundle is neither published nor uploaded to Google Play.
      - name: Publish the debug APK
        if: ${{ !cancelled() && hashFiles('build/ci/*.apk') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/ci/*.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      # The bundle holds no secret; like the APK, anyone signed in to GitHub can download it.
      - name: Publish the app bundle for Google Play
        if: steps.build.outputs.bundle != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/ci/${{ steps.build.outputs.bundle }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.run_number }}
          path: |
            */build/reports/
            */build/test-results/
          retention-days: 7

  # Publishes the app bundle of a green build of main on Google Play internal testing, and nowhere
  # else. This is the only job that names the Google Play key, so only its runner holds the key, for
  # every step of the job. Until the key is set, which comes after the app's first release was rolled
  # out by hand (README, "Release through Google Play"), the job only says so and publishes nothing.
  publish:
    name: Publish the app bundle on Google Play internal testing
    needs: build
    if: >-
      needs.build.outputs.bundle != '' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One upload at a time: a new edit invalidates one that is still open. A running upload is never
    # cancelled; one that waits gives way to a newer one.
    concurrency:
      group: google-play-internal-testing
      cancel-in-progress: false
    # Only whether the key is set, true or false, reaches the environment of every step.
    env:
      PLAY_KEY_SET: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
    steps:
      - name: Report that no Google Play key is set
        if: env.PLAY_KEY_SET != 'true'
        run: |
          echo "::notice::No Google Play key yet, so nothing is published (README, Release through Google Play)."

      - name: Check out
        if: env.PLAY_KEY_SET == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The bundle the build job checked, as it is: never unzipped.
      - name: Download the app bundle
        if: env.PLAY_KEY_SET == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.bundle }}
          path: ${{ runner.temp }}/bundle
          skip-decompress: true

      # Of all steps, only this one has the Google Play key in its environment.
      - name: Upload to internal testing
        if: env.PLAY_KEY_SET == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
        run: |
          shopt -s nullglob
          bundles=("$RUNNER_TEMP"/bundle/*)
          [[ ${#bundles[@]} -eq 1 ]] || { echo "Expected one downloaded bundle, found ${#bundles[@]}." >&2; exit 1; }
          scripts/play-upload.sh --package io.github.purplepalm.custommaps --track internal \
            --version-code "$VERSION_CODE" "${bundles[0]}"
